<form method="get" action="thanks.html"  class="myform">

<label>First Name: <input type="text" name="firstname" required></label>

     </fieldset>
     <fieldset>

<label><input type="radio" value="Video" name="method"> Video</label>
</fieldset>

<fieldset>
<legend>Video Chat preferences</legend>

<label><input type= "checkbox" name="Tuesday"value= "Tuesday">Tuesday</label>
<label><input type= "checkbox" name="Wednesday"value= "Wednesday">Wednesday</label>
<label><input type= "checkbox" name="Thursday"value= "Thursday">Thursday </label>
<label><input type= "checkbox" name="Saturday"value= "Saturday">Saturday</label>

<br><br>
<label>Chat times
<select name="chat">
<option value="none"> Please Select</option>
<option value="five">Five O'clock</option>
<option value="six">Six O'clock</option>
<option value="seven">Seven O'clock</option> 
<option value="eight">Eight O'clock</option>
</select>
</label>
